    body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }

     
        .btn-open {
            background-color: #5bc0de;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-open:hover { background-color: #31b0d5; }

    
        .modal {
            display: none; 
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }

        
        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            border: 1px solid #ff4d4d; 
            width: 500px;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            animation: fadeIn 0.3s; 
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }


        .modal-header {
            padding: 15px 20px;
            text-align: center;
            position: relative;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 26px;
            color: #333;
        }
        .close-top {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            color: #aaa;
            cursor: pointer;
        }
        .close-top:hover { color: #000; }

        /* Phần Thân Modal */
        .modal-body {
            padding: 0 20px 20px 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        .form-group input[type="text"], 
        .form-group input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; 
        }
        
        .remember-me {
            margin-bottom: 15px;
            font-size: 14px;
            color: #555;
        }

        /* Nút Đăng nhập */
        .btn-login {
            background-color: #5cb85c;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-login:hover { background-color: #4cae4c; }

    
        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fafafa;
        }
        
        /* Nút Hủy bỏ */
        .btn-cancel {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-cancel:hover { background-color: #c9302c; }

        /* Link bên dưới */
        .footer-links {
            text-align: right;
            font-size: 13px;
            color: #555;
        }
        .footer-links a {
            color: #337ab7;
            text-decoration: none;
        }
        .footer-links a:hover { text-decoration: underline; }

<div class="container">
  <h2>Mở biểu mẫu đăng nhập</h2>
    <button id="openModalBtn" class="btn-open">Mở hộp thoại</button>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            
            <div class="modal-header">
                <span class="close-top" id="closeTopBtn">&times;</span>
                <h2><i class="fas fa-lock "></i> Đăng nhập</h2>
            </div>
            
            <div class="modal-body">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Người dùng:</label>
                    <input type="text" placeholder="Nhập tên người dùng">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-eye"></i> Mật khẩu:</label>
                    <input type="password" placeholder="Nhập mật khẩu">
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="remember"> 
                    <label for="remember" style="display:inline; font-weight:normal;">Ghi nhớ tôi</label>
                </div>
                <button class="btn-login"><i class="fas fa-power-off"></i> Đăng nhập</button>
            </div>
            
            <div class="modal-footer">
                <button class="btn-cancel" id="closeBottomBtn"><i class="fas fa-times"></i> Hủy bỏ</button>
                <div class="footer-links">
                    Bạn chưa phải là thành viên? <a href="#">Đăng ký</a><br>
                    Quên <a href="#">mật khẩu?</a>
                </div>
            </div>
            
        </div>
    </div>
</div>
    
    <script>
        
        var modal = document.getElementById("loginModal");
        var btnOpen = document.getElementById("openModalBtn");
        var btnCloseTop = document.getElementById("closeTopBtn");
        var btnCloseBottom = document.getElementById("closeBottomBtn");

      
        btnOpen.onclick = function() {
            modal.style.display = "block";
        }

     
        btnCloseTop.onclick = function() {
            modal.style.display = "none";
        }

      
        btnCloseBottom.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
