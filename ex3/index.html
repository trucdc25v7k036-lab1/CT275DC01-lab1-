<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 3 - Biểu mẫu đăng nhập</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>

    .custom-card {
        max-width: 550px;
        margin: 50px auto;
        border: 1px solid #bce8f1;
        border-radius: 4px;
    }
    .custom-header {
        background-color: #d9edf7;
        color: #31708f;
        border-bottom: 1px solid #bce8f1;
        padding: 12px 15px;
    }
    .form-label-custom {
        font-weight: bold;
        color: #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card custom-card shadow-sm">
      <div class="card-header custom-header">
        Biểu mẫu đăng nhập
      </div>
      <div class="card-body p-4 pb-3">

        <form>
          <!-- Hàng: Email -->
          <div class="row mb-3 align-items-center">
            <label for="inputEmail" class="col-sm-3 col-form-label text-sm-end form-label-custom">Email:</label>
            <div class="col-sm-9">
              <input type="email" class="form-control" id="inputEmail" placeholder="Nhập vào email">
            </div>
          </div>
          

          <div class="row mb-3 align-items-center">
            <label for="inputPassword" class="col-sm-3 col-form-label text-sm-end form-label-custom">Mật khẩu:</label>
            <div class="col-sm-9">
              <input type="password" class="form-control" id="inputPassword" placeholder="Nhập vào mật khẩu">
            </div>
          </div>
          

          <div class="row mb-3">
            <div class="col-sm-9 offset-sm-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-secondary" for="rememberMe">
                  Ghi nhớ tôi
                </label>
              </div>
            </div>
          </div>
          
       
          <div class="row">
            <div class="col-sm-9 offset-sm-3">
              <button type="submit" class="btn btn-primary px-3">Đăng nhập</button>
            </div>
          </div>
        </form>

      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
